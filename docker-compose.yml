services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Keeps the 05:00 auto-push on local time rather than the container's UTC.
      TZ: ${TZ:-UTC}
    volumes:
      - pulse-data:/app/data
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pulse-data:
